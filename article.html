<style>
*{box-sizing:border-box}a:focus-visible,button:focus-visible{outline:3px solid #f4a261;outline-offset:3px}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}body{margin:0;background:#f4f7f9;color:#222;font-family:Arial,Helvetica,sans-serif;line-height:1.75}#readingProgress{position:fixed;top:0;left:0;width:100%;height:4px;background:#dce6ea;z-index:2000}#readingProgressBar{height:100%;width:0;background:#ffd166;transition:width .08s linear}header{background:#073b4c;color:white;padding:14px 18px}header a{color:white;text-decoration:none;font-weight:bold}.wrap{max-width:850px;margin:30px auto;padding:0 16px}.article{background:white;border-radius:15px;padding:clamp(18px,4vw,36px);box-shadow:0 3px 14px #00000012}.category{color:#118ab2;font-weight:bold}.date{color:#68777d;font-size:14px}h1{line-height:1.25;color:#073b4c;font-size:clamp(28px,5vw,42px)}.cover{display:block;width:100%;max-height:480px;object-fit:cover;border-radius:10px;margin:18px 0}.content{white-space:pre-wrap;overflow-wrap:anywhere;font-size:18px;line-height:1.85}.reader-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}.reader-tools .btn{margin:0}.reader-label{font-size:14px;color:#53616a;margin-right:2px}.btn{display:inline-block;border:0;border-radius:8px;padding:11px 16px;margin:8px 8px 0 0;background:#ffd166;color:#222;font-weight:bold;text-decoration:none;cursor:pointer;font-size:15px}.dark{background:#073b4c;color:white}.status{padding:22px;text-align:center;color:#555}.error{color:#9b1c1c}footer{text-align:center;color:#53616a;padding:25px;font-size:14px}@media(max-width:600px){.wrap{margin:16px auto}.content{font-size:16px}}
.skip-link{position:absolute;left:12px;top:-100px;z-index:2000;background:#ffd166;color:#172b32;padding:12px 16px;border-radius:8px;font-weight:bold}.skip-link:focus{top:12px}
</style>
</head>
<body>
<a class="skip-link" href="#article">Ruka hadi kwenye makala / Skip to article</a>
<div id="readingProgress" aria-hidden="true"><div id="readingProgressBar"></div></div>
<header><a href="./">← WATAFITI | Rudi mwanzo</a></header>
<main class="wrap">
<article class="article" id="article"><p class="status" id="status">Inapakia makala...</p></article>
<div id="actions" hidden>
<button class="btn" id="share">🔗 Shiriki makala</button>
<button class="btn dark" id="copy">Nakili kiungo</button>
<a class="btn dark" href="./#taarifa">📰 Makala nyingine</a>
<div class="reader-tools" aria-label="Mipangilio ya kusoma"><span class="reader-label">Ukubwa wa maandishi:</span><button class="btn dark" id="fontDown" type="button" aria-label="Punguza ukubwa wa maandishi">A−</button><button class="btn dark" id="fontUp" type="button" aria-label="Ongeza ukubwa wa maandishi">A+</button><button class="btn" id="fontReset" type="button">Rudisha kawaida</button></div>
</div>
</main>
<footer>© 2026 WATAFITI — Tuchunguze Ukweli wa Dunia Pamoja</footer>
<script>
(function(){
 const SUPABASE_URL="https://zleflmeepyearrocaheg.supabase.co";
 const SUPABASE_KEY="sb_publishable_0SA-j8i6kAJT69XO0T-gpA_WHWMaEcF";
 const params=new URLSearchParams(location.search);
 const id=params.get("id");
 const host=document.getElementById("article");
 const status=document.getElementById("status");
 const actions=document.getElementById("actions");
 const progressBar=document.getElementById("readingProgressBar");
 const shareUrl=location.href;
 function meta(name,content,property){
   let el=document.querySelector(property?'meta[property="'+name+'"]':'meta[name="'+name+'"]');
   if(!el){el=document.createElement("meta");if(property)el.setAttribute("property",name);else el.setAttribute("name",name);document.head.appendChild(el);}
   el.setAttribute("content",content);
 }
 function showError(message){status.className="status error";status.textContent=message;}
 if(!id){showError("Kiungo hiki hakina namba ya makala. Rudi mwanzo na uchague makala.");return;}
 fetch(SUPABASE_URL+"/rest/v1/articles?select=id,title,content,image_url,category,created_at&published=eq.true&id=eq."+encodeURIComponent(id)+"&limit=1",{
   headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}
 }).then(function(r){if(!r.ok)throw new Error("load");return r.json();}).then(function(rows){
   if(!rows.length){showError("Makala haijapatikana au haijachapishwa. Tafadhali rudi mwanzo.");return;}
   const a=rows[0], title=a.title||"Makala ya WATAFITI", description=(a.content||"Soma makala kutoka WATAFITI.").replace(/\s+/g," ").slice(0,180);
   document.title=title+" | WATAFITI";
   meta("description",description,false);
   meta("og:title",title,true);meta("og:description",description,true);meta("og:url",shareUrl,true);
   meta("twitter:title",title,false);meta("twitter:description",description,false);
   let canonical=document.querySelector('link[rel="canonical"]');if(canonical)canonical.href=shareUrl;
   host.innerHTML="";
   if(a.category){const category=document.createElement("div");category.className="category";category.textContent=a.category;host.appendChild(category);}
   const h=document.createElement("h1");h.textContent=title;host.appendChild(h);
   const date=document.createElement("p");date.className="date";date.textContent=a.created_at?new Date(a.created_at).toLocaleDateString("sw-TZ",{day:"numeric",month:"long",year:"numeric"}):"";host.appendChild(date);
   if(a.image_url){const img=document.createElement("img");img.className="cover";img.src=a.image_url;img.alt=title;img.onerror=function(){this.remove();};host.appendChild(img);meta("og:image",a.image_url,true);meta("twitter:image",a.image_url,false);}
   const content=document.createElement("div");content.className="content";content.textContent=a.content||"";host.appendChild(content);
   let fontSize=18;
   function setFontSize(size){fontSize=Math.max(14,Math.min(26,size));content.style.fontSize=fontSize+"px";}
   document.getElementById("fontDown").addEventListener("click",function(){setFontSize(fontSize-2);});
   document.getElementById("fontUp").addEventListener("click",function(){setFontSize(fontSize+2);});
   document.getElementById("fontReset").addEventListener("click",function(){setFontSize(18);});
   actions.hidden=false;
   document.getElementById("share").addEventListener("click",async function(){
     try{if(navigator.share){await navigator.share({title:title,text:description,url:shareUrl});}else{await navigator.clipboard.writeText(shareUrl);alert("Kiungo kimenakiliwa.");}}
     catch(e){if(e&&e.name!=="AbortError"){prompt("Nakili kiungo hiki:",shareUrl);}}
   });
   document.getElementById("copy").addEventListener("click",async function(){
     try{await navigator.clipboard.writeText(shareUrl);alert("Kiungo kimenakiliwa. Shiriki kwa marafiki.");}
     catch(e){prompt("Nakili kiungo hiki:",shareUrl);}
   });
 }).catch(function(){showError("Imeshindikana kupakia makala. Angalia intaneti kisha ujaribu tena.");});
  function updateReadingProgress(){
    const doc=document.documentElement;
    const scrollable=doc.scrollHeight-window.innerHeight;
    const progress=scrollable>0?Math.min(100,Math.max(0,(window.scrollY/scrollable)*100)):100;
    if(progressBar)progressBar.style.width=progress+"%";
  }
  window.addEventListener("scroll",updateReadingProgress,{passive:true});
  window.addEventListener("resize",updateReadingProgress);
  updateReadingProgress();
})();
</script>
</body>
</html>
