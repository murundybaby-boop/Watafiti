/* WATAFITI article reading polish */
.wrap{width:min(100%,882px)}
.article{border:1px solid #e4edf0}
.article h1{margin:8px 0 10px;letter-spacing:-.35px;overflow-wrap:anywhere}
.category{display:inline-block;padding:5px 10px;background:#eaf5f8;border-radius:999px;font-size:13px;margin-bottom:7px}
.date{margin-bottom:10px}
.cover{max-height:min(58vw,480px);min-height:180px;object-position:center;background:#edf2f4}
.content{color:#2c3f46;overflow-wrap:anywhere}
#actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:16px 0 24px}
#actions>.btn{margin:0;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
#actions .reader-tools{width:100%;padding:13px 14px;margin-top:5px;background:#fff;border:1px solid #e1eaed;border-radius:12px}
#actions .reader-tools .btn{margin:0;min-height:42px}
.related{border:1px solid #e4edf0}
.related h2{line-height:1.3;margin-bottom:15px}
.related-card{min-width:0}
.related-card h3{overflow-wrap:anywhere}
.related-card:focus-visible{outline:3px solid #f4a261;outline-offset:3px}
@media(hover:hover){.btn{transition:filter .15s,transform .15s}.btn:hover{filter:brightness(.97);transform:translateY(-1px)}}
@media(max-width:600px){
.wrap{margin:12px auto;padding:0 10px}
.article{padding:18px 15px;border-radius:13px}
.article h1{font-size:clamp(27px,7vw,34px);line-height:1.22}
.cover{min-height:0;max-height:62vw;border-radius:9px;margin:14px 0}
.content{font-size:16px;line-height:1.8}
#actions{gap:8px;margin:12px 0 20px}
#actions>.btn{flex:1 1 calc(50% - 8px);padding:11px 9px;font-size:14px;text-align:center}
#actions .reader-tools{gap:7px;padding:11px}
#actions .reader-label{width:100%;margin-bottom:2px}
#actions .reader-tools .btn{flex:1 1 auto;padding:10px 11px}
.related{padding:18px 14px}
.related h2{font-size:20px}
.related-grid{gap:10px}
.related-card img{height:118px}
.related-card-copy{padding:10px}
.related-card h3{font-size:15px}
}
@media(max-width:380px){
#actions>.btn{flex-basis:100%}
.related-card{grid-template-columns:88px minmax(0,1fr)}
.related-card img{min-height:88px}
.related-card-copy{padding:8px}
.related-card h3{font-size:14px}
}

<body>
<a class="skip-link" href="#article">Ruka hadi kwenye makala / Skip to article</a>
<div id="readingProgress" aria-hidden="true"><div id="readingProgressBar"></div></div>
<header><a href="./">← WATAFITI | Rudi mwanzo</a></header>
<main class="wrap">
<article class="article" id="article"><p class="status" id="status">Inapakia makala...</p></article>
<section class="article related" id="relatedSection" hidden aria-labelledby="relatedHeading"><h2 id="relatedHeading">Makala zinazohusiana</h2><div id="relatedArticles" class="related-grid"></div></section>
<div id="actions" hidden>
<button class="btn" id="share">🔗 Shiriki makala</button>
<button class="btn dark" id="copy">Nakili kiungo</button>
<a class="btn dark" href="./#taarifa">📰 Makala nyingine</a>
<div class="reader-tools" aria-label="Mipangilio ya kusoma"><span class="reader-label">Ukubwa wa maandishi:</span><button class="btn dark" id="fontDown" type="button" aria-label="Punguza ukubwa wa maandishi">A−</button><button class="btn dark" id="fontUp" type="button" aria-label="Ongeza ukubwa wa maandishi">A+</button><button class="btn" id="fontReset" type="button">Rudisha kawaida</button></div>
</div>
</main>
<footer>© 2026 WATAFITI — Tuchunguze Ukweli wa Dunia Pamoja</footer>
<script>
(function(){
 const SUPABASE_URL="https://zleflmeepyearrocaheg.supabase.co";
 const SUPABASE_KEY="sb_publishable_0SA-j8i6kAJT69XO0T-gpA_WHWMaEcF";
 const params=new URLSearchParams(location.search);
 const id=params.get("id");
 const host=document.getElementById("article");
 const status=document.getElementById("status");
 const actions=document.getElementById("actions");
 const progressBar=document.getElementById("readingProgressBar");
 const shareUrl=location.href;
 function meta(name,content,property){
   let el=document.querySelector(property?'meta[property="'+name+'"]':'meta[name="'+name+'"]');
   if(!el){el=document.createElement("meta");if(property)el.setAttribute("property",name);else el.setAttribute("name",name);document.head.appendChild(el);}
   el.setAttribute("content",content);
 }
 function showError(message){status.className="status error";status.textContent=message;}
 function showRetryError(message){
   showError(message);
   const retry=document.createElement("button");
   retry.type="button";retry.className="btn";retry.textContent="↻ Jaribu tena";
   retry.addEventListener("click",function(){location.reload();});
   status.appendChild(document.createElement("br"));
   status.appendChild(retry);
 }
 if(!id){showError("Kiungo hiki hakina namba ya makala. Rudi mwanzo na uchague makala.");return;}
 fetch(SUPABASE_URL+"/rest/v1/articles?select=id,title,content,image_url,category,created_at&published=eq.true&id=eq."+encodeURIComponent(id)+"&limit=1",{
   headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}
 }).then(function(r){if(!r.ok)throw new Error("load");return r.json();}).then(function(rows){
   if(!rows.length){showError("Makala haijapatikana au haijachapishwa. Tafadhali rudi mwanzo.");return;}
   const a=rows[0], title=a.title||"Makala ya WATAFITI", description=(a.content||"Soma makala kutoka WATAFITI.").replace(/\s+/g," ").slice(0,180);
   document.title=title+" | WATAFITI";
   meta("description",description,false);
   meta("og:title",title,true);meta("og:description",description,true);meta("og:url",shareUrl,true);
   meta("twitter:title",title,false);meta("twitter:description",description,false);
   let canonical=document.querySelector('link[rel="canonical"]');if(canonical)canonical.href=shareUrl;
   const articleSchema={"@context":"https://schema.org","@type":"Article","headline":title,"description":description,"url":shareUrl,"mainEntityOfPage":{"@type":"WebPage","@id":shareUrl},"inLanguage":"sw-TZ","publisher":{"@type":"Organization","name":"WATAFITI","url":"https://murundybaby-boop.github.io/Watafiti/"}};
   if(a.created_at)articleSchema.datePublished=a.created_at;
   if(a.category)articleSchema.articleSection=a.category;
   if(a.image_url)articleSchema.image=[a.image_url];
   const schemaScript=document.createElement("script");schemaScript.type="application/ld+json";schemaScript.id="articleStructuredData";schemaScript.textContent=JSON.stringify(articleSchema);document.head.appendChild(schemaScript);
   host.innerHTML="";
   if(a.category){const category=document.createElement("div");category.className="category";category.textContent=a.category;host.appendChild(category);}
   const h=document.createElement("h1");h.textContent=title;host.appendChild(h);
   const date=document.createElement("p");date.className="date";date.textContent=a.created_at?new Date(a.created_at).toLocaleDateString("sw-TZ",{day:"numeric",month:"long",year:"numeric"}):"";host.appendChild(date);
   if(a.image_url){const img=document.createElement("img");img.className="cover";img.src=a.image_url;img.alt=title;img.onerror=function(){this.remove();};host.appendChild(img);meta("og:image",a.image_url,true);meta("og:image:alt",title,true);meta("twitter:image",a.image_url,false);meta("twitter:image:alt",title,false);}
   const content=document.createElement("div");content.className="content";content.textContent=a.content||"";host.appendChild(content);
   if(a.category){
     fetch(SUPABASE_URL+"/rest/v1/articles?select=id,title,category,image_url,created_at&published=eq.true&category=eq."+encodeURIComponent(a.category)+"&id=neq."+encodeURIComponent(a.id)+"&order=created_at.desc&limit=3",{
       headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}
     }).then(function(r){if(!r.ok)throw new Error("related");return r.json();}).then(function(rows){
       if(!rows.length)return;
       const relatedHost=document.getElementById("relatedArticles"),relatedSection=document.getElementById("relatedSection");
       rows.forEach(function(item){
         const link=document.createElement("a");link.className="related-card";link.href="./article.html?id="+encodeURIComponent(item.id);
         if(item.image_url){const image=document.createElement("img");image.src=item.image_url;image.alt="";image.loading="lazy";image.decoding="async";image.onerror=function(){this.remove();};link.appendChild(image);}
         const copy=document.createElement("div");copy.className="related-card-copy";
         const heading=document.createElement("h3");heading.textContent=item.title||"Makala ya WATAFITI";copy.appendChild(heading);
         const dateLabel=document.createElement("small");dateLabel.textContent=item.created_at?new Date(item.created_at).toLocaleDateString("sw-TZ",{day:"numeric",month:"short",year:"numeric"}):"WATAFITI";copy.appendChild(dateLabel);
         link.appendChild(copy);relatedHost.appendChild(link);
       });
       relatedSection.hidden=false;updateReadingProgress();
     }).catch(function(){});
   }
   let fontSize=18;
   function setFontSize(size){fontSize=Math.max(14,Math.min(26,size));content.style.fontSize=fontSize+"px";}
   document.getElementById("fontDown").addEventListener("click",function(){setFontSize(fontSize-2);});
   document.getElementById("fontUp").addEventListener("click",function(){setFontSize(fontSize+2);});
   document.getElementById("fontReset").addEventListener("click",function(){setFontSize(18);});
   actions.hidden=false;
   document.getElementById("share").addEventListener("click",async function(){
     try{if(navigator.share){await navigator.share({title:title,text:description,url:shareUrl});}else{await navigator.clipboard.writeText(shareUrl);alert("Kiungo kimenakiliwa.");}}
     catch(e){if(e&&e.name!=="AbortError"){prompt("Nakili kiungo hiki:",shareUrl);}}
   });
   document.getElementById("copy").addEventListener("click",async function(){
     try{await navigator.clipboard.writeText(shareUrl);alert("Kiungo kimenakiliwa. Shiriki kwa marafiki.");}
     catch(e){prompt("Nakili kiungo hiki:",shareUrl);}
   });
 }).catch(function(){showRetryError("Imeshindikana kupakia makala. Angalia intaneti kisha bonyeza Jaribu tena.");});
  function updateReadingProgress(){
    const doc=document.documentElement;
    const scrollable=doc.scrollHeight-window.innerHeight;
    const progress=scrollable>0?Math.min(100,Math.max(0,(window.scrollY/scrollable)*100)):100;
    if(progressBar)progressBar.style.width=progress+"%";
  }
  window.addEventListener("scroll",updateReadingProgress,{passive:true});
  window.addEventListener("resize",updateReadingProgress);
  updateReadingProgress();
})();
</script>
</body>
