<!doctype html>
<html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WATAFITI Admin</title><style>
*{box-sizing:border-box}body{margin:0;font:16px Arial,sans-serif;background:#f3f6f8;color:#17313b}header{background:#073b4c;color:white;padding:18px}main{max-width:850px;margin:24px auto;padding:16px}.panel{background:white;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 4px 18px #102a3512}input,textarea,select,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccd7dc;border-radius:8px;font:inherit}textarea{min-height:130px}button{background:#087f8c;color:white;border:0;font-weight:bold;cursor:pointer}button.secondary{background:#52656d}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none}.hint{color:#53666e;font-size:14px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head>
<body><header><strong>WATAFITI — Admin</strong> <a href="/" style="color:white;float:right">Tovuti</a></header><main>
<div class="panel" id="loginPanel"><h2>Ingia kwenye usimamizi</h2><p class="hint">Tumia akaunti ya Supabase Auth iliyoidhinishwa kama admin.</p><form id="loginForm"><input id="email" type="email" placeholder="Barua pepe ya admin" required><input id="password" type="password" placeholder="Password" required><button>Ingia</button></form><p id="loginMessage" role="status"></p></div>
<div class="panel hidden" id="adminPanel"><div class="row"><h2>Habari / Makala</h2><button class="secondary" id="logoutBtn">Toka</button></div><form id="articleForm"><input id="articleTitle" placeholder="Kichwa cha habari" required><div class="row"><input id="articleCategory" placeholder="Aina / category"><input id="articleImage" type="url" placeholder="URL ya picha (si lazima)"></div><textarea id="articleContent" placeholder="Andika habari hapa..." required></textarea><label><input id="articlePublished" type="checkbox" checked style="width:auto"> Chapisha kwa umma</label><button>Hifadhi habari</button></form><p id="articleMessage" role="status"></p><h3>Habari zilizopo</h3><div id="articleList"></div></div>
<p class="hint">Usiweke service_role key kwenye ukurasa huu. Ruhusa za admin zinadhibitiwa na sera za Supabase.</p></main>
<script>
(function(){
const URL="https://zleflmeepyearrocaheg.supabase.co";
const KEY="sb_publishable_0SA-j8i6kAJT69XO0T-gpA_WHWMaEcF";
let token="", user=null;
const el=id=>document.getElementById(id);
function apiHeaders(extra){return Object.assign({"apikey":KEY,"Authorization":"Bearer "+(token||KEY)},extra||{});}
async function request(path,opts){const r=await fetch(URL+path,opts);const t=await r.text();let data;try{data=t?JSON.parse(t):null}catch(_){data=t}if(!r.ok)throw new Error(data&&data.message?data.message:(typeof data==="string"?data:"Ombi limekataliwa"));return data;}
function setLoggedIn(on){el("loginPanel").classList.toggle("hidden",on);el("adminPanel").classList.toggle("hidden",!on);}
el("loginForm").addEventListener("submit",async e=>{e.preventDefault();el("loginMessage").textContent="Inaingia...";try{const d=await request("/auth/v1/token?grant_type=password",{method:"POST",headers:apiHeaders({"Content-Type":"application/json"}),body:JSON.stringify({email:el("email").value.trim(),password:el("password").value})});token=d.access_token;user=d.user;setLoggedIn(true);el("loginMessage").textContent="";await loadArticles();}catch(err){el("loginMessage").textContent="Imeshindikana kuingia: "+(err.message||"Angalia akaunti na mipangilio ya Supabase.");setLoggedIn(false);}});
el("logoutBtn").addEventListener("click",async()=>{try{await request("/auth/v1/logout",{method:"POST",headers:apiHeaders()});}catch(_){}token="";user=null;setLoggedIn(false);});
async function loadArticles(){const host=el("articleList");host.textContent="Inapakia...";try{const rows=await request("/rest/v1/articles?select=title,content,image_url,category,published",{headers:apiHeaders()});host.textContent="";if(!rows.length){host.textContent="Hakuna makala zinazoonekana au huna ruhusa.";return;}rows.forEach(a=>{const box=document.createElement("div");box.style.cssText="padding:12px 0;border-top:1px solid #ddd";const h=document.createElement("strong");h.textContent=a.title||"Bila kichwa";const p=document.createElement("p");p.textContent=(a.published?"Imechapishwa":"Rasimu")+" · "+(a.category||"Bila aina");box.append(h,p);host.append(box);});}catch(err){host.textContent="Imeshindikana kupakia makala: "+(err.message||"Kagua sera za Supabase.");}}
el("articleForm").addEventListener("submit",async e=>{e.preventDefault();el("articleMessage").textContent="Inahifadhi...";try{await request("/rest/v1/articles",{method:"POST",headers:apiHeaders({"Content-Type":"application/json","Prefer":"return=minimal"}),body:JSON.stringify({title:el("articleTitle").value.trim(),content:el("articleContent").value.trim(),category:el("articleCategory").value.trim()||null,image_url:el("articleImage").value.trim()||null,published:el("articlePublished").checked})});el("articleForm").reset();el("articlePublished").checked=true;el("articleMessage").textContent="Habari imehifadhiwa.";await loadArticles();}catch(err){el("articleMessage").textContent="Haijahifadhiwa: "+(err.message||"Kagua ruhusa za admin na usanidi wa Supabase.");}});
})();
</script></body></html>
